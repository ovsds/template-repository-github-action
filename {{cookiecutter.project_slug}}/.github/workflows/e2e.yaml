name: E2E

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ "{{" }} github.workflow }}-${{ "{{" }} github.event.number }}
  cancel-in-progress: true

jobs:
  e2e-default:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Run
        id: test-run
        uses: $/
        with:
          placeholder: "test_placeholder"

      - name: Assert placeholder
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ "{{" }} steps.test-run.outputs.placeholder }}
          expected: "test_placeholder"
  e2e:
    runs-on: ubuntu-latest
    if: always() && !cancelled()

    permissions: {}

    needs:
      - e2e-default

    steps:
      - name: Collect Results
        uses: ovsds/collect-needs-result-action@12190e2a1bfe85d9c024f190a3833973e97998f8 # v1.0.0
        with:
          needs_json: ${{ "{{" }} toJson(needs) }}
          skip_allowed: false
